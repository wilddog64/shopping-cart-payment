---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shopping-cart-payment

labels:
- pairs:
    app.kubernetes.io/managed-by: kustomize
  includeSelectors: false

# Secrets (payment-db-credentials, payment-encryption-secret) are NOT listed here.
# They are provisioned at runtime by ESO ExternalSecrets in the data-layer ArgoCD app.
# Do not add Secret manifests to this list — ESO owns them via creationPolicy: Owner.
resources:
- serviceaccount.yaml
- configmap.yaml
- deployment.yaml
- service.yaml
- networkpolicy.yaml

commonLabels:
  app.kubernetes.io/part-of: shopping-cart
  app.kubernetes.io/version: "1.0.0"

images:
  - name: ghcr.io/your-org/payment-service
    newName: ghcr.io/wilddog64/shopping-cart-payment
    newTag: sha-a672ee42f79db703f632baca3b05bf4f2b4d8718
